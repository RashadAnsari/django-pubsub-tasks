[tool.poetry]
name = "django-pubsub-tasks"
version = "0.1.0"
description = "A Celery-like task queue for Django on Google Cloud Pub/Sub push subscriptions"
authors = []

[tool.poetry.dependencies]
python = "^3.11"
Django = "^5.1.2"
google-cloud-pubsub = "^2.26.1"
google-auth = "^2.35.0"  # verifies Pub/Sub push tokens in tasks/views.py
requests = "^2.32.3"  # transport for google-auth token verification
dataclass-wizard = "^0.23.0"
django-simple-history = "^3.7.0"

[tool.poetry.dev-dependencies]
ruff = "^0.7.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["I001"]

[tool.ruff.lint.isort]
section-order = ["future", "standard-library", "django", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.isort.sections]
"django" = ["django"]
